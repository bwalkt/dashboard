<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/app/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Noto+Sans+Mono:wght@100..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
      /* NProgress styles */
      #nprogress { pointer-events: none; }
      #nprogress .bar { background: var(--primary, #29d); position: fixed; z-index: 1031; top: 0; left: 0; width: 100%; height: 2px; }
    </style>
    <title>Salesforce Dashboard</title>
  </head>
  <body>
    <div id="root">
      <div style="padding: 20px; font-family: sans-serif; background: #f0f0f0; min-height: 100vh;">
        <h1>Loading Salesforce Dashboard...</h1>
        <p>If you see this message for more than a few seconds, there may be a JavaScript loading issue.</p>
        <div id="debug-info">
          <h3>Debug Information:</h3>
          <p>Timestamp: <span id="timestamp"></span></p>
          <p>User Agent: <span id="user-agent"></span></p>
          <p>Location: <span id="location"></span></p>
        </div>
      </div>
    </div>
    <script>
      // Add immediate debug info before module loads
      document.getElementById('timestamp').textContent = new Date().toISOString();
      document.getElementById('user-agent').textContent = navigator.userAgent;
      document.getElementById('location').textContent = window.location.href;
      console.log('=== HTML SCRIPT RUNNING ===');
      console.log('Before main.tsx load:', new Date().toISOString());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
