name: "Detect Service Changes"
description: "Detects which services have changed and outputs a JSON array of service names"

inputs:
  force_build_all:
    description: "Force build all services (for manual workflow dispatch)"
    required: false
    default: "false"
  event_name:
    description: "GitHub event name (pull_request, push, workflow_dispatch)"
    required: true
  target_branch:
    description: "Target branch for comparison (default: main)"
    required: false
    default: "main"

outputs:
  services:
    description: "JSON array of services that need to be built"
    value: ${{ steps.detect.outputs.services }}

runs:
  using: "composite"
  steps:
    - name: Detect service changes
      id: detect
      shell: bash
      run: |
        # Initialize variables
        FORCE_BUILD_ALL=false
        SERVICES="[]"

        # Handle manual workflow dispatch
        if [ "${{ inputs.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ inputs.force_build_all }}" = "true" ] || [ "${{ inputs.force_build_all }}" = true ] || [ "${{ inputs.force_build_all }}" = "1" ]; then
            FORCE_BUILD_ALL=true
          fi
        fi

        # Get changed files
        if [ "${{ inputs.event_name }}" = "pull_request" ]; then
          CHANGED_FILES=$(git diff --name-only origin/${{ inputs.target_branch }}...HEAD)
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi

        # Load services from services.json
        SERVICES_CONFIG=".github/actions/service-config/services.json"
        if [ ! -f "$SERVICES_CONFIG" ]; then
          echo "services=[]" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Extract all service names from services.json
        ALL_SERVICES=$(jq -r '.services[].name' "$SERVICES_CONFIG")
        ALL_SERVICES_ARRAY=()
        while IFS= read -r service; do
          ALL_SERVICES_ARRAY+=("$service")
        done <<< "$ALL_SERVICES"

        # Extract service names from changed files
        SERVICES_ARRAY=()

        # Check each service's dockerfile and context paths
        for service_name in "${ALL_SERVICES_ARRAY[@]}"; do
          # Get dockerfile and context paths for this service
          dockerfile=$(jq -r --arg name "$service_name" '.services[] | select(.name == $name) | .dockerfile' "$SERVICES_CONFIG")
          context=$(jq -r --arg name "$service_name" '.services[] | select(.name == $name) | .context' "$SERVICES_CONFIG")
          
          # Get directory from dockerfile path (remove filename)
          dockerfile_dir=$(dirname "$dockerfile")
          
          # Check if any changed file is in the dockerfile directory or context directory
          for file in $CHANGED_FILES; do
            # Check if file is in dockerfile directory
            if [[ "$file" == "$dockerfile_dir"* ]] || [[ "$file" == "$context"* ]] || [[ "$file" == "$context/"* ]]; then
              if [[ ! " ${SERVICES_ARRAY[@]} " =~ " $service_name " ]]; then
                SERVICES_ARRAY+=("$service_name")
              fi
            fi
          done
        done

        # Check for shared directory changes (packages/shared/)
        if echo "$CHANGED_FILES" | grep -q "^packages/shared/"; then
          # If shared code changed, build sfdc-server-vanilla
          if [[ ! " ${SERVICES_ARRAY[@]} " =~ " sfdc-server-vanilla " ]]; then
            SERVICES_ARRAY+=("sfdc-server-vanilla")
          fi
        fi

        # Handle force build all case
        if [ "$FORCE_BUILD_ALL" = "true" ]; then
          SERVICES_ARRAY=("${ALL_SERVICES_ARRAY[@]}")
        fi

        # Convert array to JSON format
        if [ ${#SERVICES_ARRAY[@]} -eq 0 ]; then
          SERVICES='[]'
        else
          SERVICES=$(printf '%s\n' "${SERVICES_ARRAY[@]}" | jq -R . | jq -s -c .)
        fi

        # Ensure SERVICES is not empty
        if [ -z "$SERVICES" ]; then
          SERVICES='[]'
        fi

        # Validate JSON format
        if ! echo "$SERVICES" | jq . > /dev/null 2>&1; then
          SERVICES='[]'
        fi

        # Set output
        echo "services=$SERVICES" >> $GITHUB_OUTPUT
