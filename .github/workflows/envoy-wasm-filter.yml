name: CI - Envoy WASM Filter

on:
  push:
    branches: [main]
    paths:
      - "packages/rust-wasm-filter/**"
      - ".github/workflows/rust-wasm-filter.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_URL: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile: packages/rust-wasm-filter/Dockerfile
          context: .
          image-name: ${{ env.GITHUB_OWNER }}/rust-wasm-filter
          image-tags: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref_name == 'main' && format('{0},latest', github.ref_name)) || github.ref_name }}
          registry: ${{ env.REGISTRY_URL }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ env.REGISTRY_URL }}/${{ env.GITHUB_OWNER }}/rust-wasm-filter:cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/rust-wasm-filter:cache,mode=max', env.REGISTRY_URL, env.GITHUB_OWNER) || '' }}
