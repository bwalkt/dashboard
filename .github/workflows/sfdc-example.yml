name: CI - SFDC Example

on:
  push:
    branches: [main]
    paths:
      - 'examples/b2b/packages/sfdc-example/**'
      - '.github/workflows/sfdc-example.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_URL: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile: examples/b2b/packages/sfdc-example/Dockerfile
          context: .
          image-name: ${{ env.GITHUB_OWNER }}/sfdc-example
          image-tags: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref_name == 'main' && format('{0},latest', github.ref_name)) || github.ref_name }}
          registry: ${{ env.REGISTRY_URL }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ env.REGISTRY_URL }}/${{ env.GITHUB_OWNER }}/sfdc-example:cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/sfdc-example:cache,mode=max', env.REGISTRY_URL, env.GITHUB_OWNER) || '' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trigger Dokploy deployment
        uses: ./.github/actions/trigger-dokploy-deployment
        with:
          webhook_url: ${{ secrets.DOKPLOY_WEBHOOK_URL_SFDC_EXAMPLE }}
          dokploy_token: ${{ secrets.DOKPLOY_TOKEN }}

