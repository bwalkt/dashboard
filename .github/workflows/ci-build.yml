name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build all services"
        required: false
        default: false
        type: boolean
      target_branch:
        description: "Target branch for comparison"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY_URL: ghcr.io
  GITHUB_OWNER: ${{ github.repository_owner }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect service changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          force_build_all: ${{ github.event.inputs.force_build_all || false }}
          event_name: ${{ github.event_name }}
          target_branch: ${{ github.event.inputs.target_branch || 'main' }}

  build-services:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' && needs.detect-changes.outputs.services != null && needs.detect-changes.outputs.services != 'null'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}

      - name: Load service configuration
        id: service-config
        run: |
          SERVICE_CONFIG=$(cat .github/actions/service-config/services.json | jq -r --arg name "${{ matrix.service }}" '.services[] | select(.name == $name) | tojson')
          echo "config=$SERVICE_CONFIG" >> $GITHUB_OUTPUT

      - name: Build Docker image
        id: build
        uses: ./.github/actions/docker-build-push
        with:
          dockerfile: ${{ fromJSON(steps.service-config.outputs.config).dockerfile }}
          context: ${{ fromJSON(steps.service-config.outputs.config).context }}
          image-name: ${{ env.GITHUB_OWNER }}/${{ fromJSON(steps.service-config.outputs.config).image_name }}
          image-tags: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref_name == 'main' && format('{0},latest', github.ref_name)) || github.ref_name }}
          registry: ${{ env.REGISTRY_URL }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ env.REGISTRY_URL }}/${{ env.GITHUB_OWNER }}/${{ fromJSON(steps.service-config.outputs.config).image_name }}:cache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/{2}:cache,mode=max', env.REGISTRY_URL, env.GITHUB_OWNER, fromJSON(steps.service-config.outputs.config).image_name) || '' }}

  deploy-sfdc-server-vanilla:
    needs: [detect-changes, build-services]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' && contains(needs.detect-changes.outputs.services, '"sfdc-server-vanilla"') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}
      - name: Trigger Coolify deployment
        uses: ./.github/actions/trigger-coolify-deployment
        with:
          webhook_url: ${{ secrets.COOLIFY_WEBHOOK_URL_SFDC }}
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}

  deploy-golang-proxy:
    needs: [detect-changes, build-services]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' && contains(needs.detect-changes.outputs.services, '"golang-proxy"') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}
      - name: Trigger Coolify deployment
        uses: ./.github/actions/trigger-coolify-deployment
        with:
          webhook_url: ${{ secrets.COOLIFY_WEBHOOK_URL_GOLANG_PROXY }}
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}

  deploy-server:
    needs: [detect-changes, build-services]
    if: ${{ github.event_name != 'pull_request' && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' && contains(needs.detect-changes.outputs.services, '"server"') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}
      - name: Trigger Coolify deployment
        uses: ./.github/actions/trigger-coolify-deployment
        with:
          webhook_url: ${{ secrets.COOLIFY_WEBHOOK_URL_SERVER }}
          coolify_token: ${{ secrets.COOLIFY_TOKEN }}
