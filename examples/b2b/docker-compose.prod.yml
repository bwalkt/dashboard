name: pzero-b2b
version: "3.9"
services:
  authz-service:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set AUTHZ_SERVICE_IMAGE to override the full image path
    image: ${AUTHZ_SERVICE_IMAGE:-ghcr.io/${GITHUB_OWNER}/authz-service:latest}
    container_name: pzero-b2b-authz-service
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CHALLENGE_SECRET=${CHALLENGE_SECRET}
      - CHALLENGE_TTL=${CHALLENGE_TTL:-300}
    restart: "no"

  pzero-sfdc-server:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set SFDC_SERVER_IMAGE to override the full image path
    image: ${SFDC_SERVER_IMAGE:-ghcr.io/${GITHUB_OWNER}/sfdc-server-vanilla:latest}
    container_name: pzero-sfdc-server
    ports:
      - "3002:3000" # Internal port for direct access (optional)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOCKER_CONTAINER=true
      # Salesforce Configuration
      - SALESFORCE_CONSUMER_KEY=${SALESFORCE_CONSUMER_KEY}
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_LOGIN_URL=${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      # GitHub OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # Redis Configuration
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      # Database Configuration
      - DATABASE_PATH=${DATABASE_PATH:-./database.db}
      # OAuth Callback URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:1420}
      # Authz Service Configuration
      - AUTHZ_SERVICE_URL=${AUTHZ_SERVICE_URL:-http://authz-service:3000}
    restart: "no"
    volumes:
      - "../../../files/keys:/app/examples/b2b/packages/sfdc-server-vanilla/dist/keys"
