name: pzero-b2b
services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: pzero-b2b-dragonfly
    restart: unless-stopped
    networks:
      - pzero-network
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pzero-sfdc-server:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set SFDC_SERVER_IMAGE to override the full image path
    build:
      context: ../../
      dockerfile: examples/b2b/packages/sfdc-server-vanilla/Dockerfile
    container_name: pzero-sfdc-server
    networks:
      - pzero-network
    ports:
      - "3000:3000" # Internal port for direct access (optional)
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_CONTAINER=true
      # Salesforce Configuration
      - SALESFORCE_CONSUMER_KEY=${SALESFORCE_CONSUMER_KEY}
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_LOGIN_URL=${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      # GitHub OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      # Database Configuration
      - DATABASE_PATH=${DATABASE_PATH:-./database.db}
      # Redis Configuration (Dragonfly is Redis-compatible)
      - REDIS_URL=${REDIS_URL:-redis://dragonfly:6379}
      # OAuth Callback URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:1420}
      # Authz Service Configuration
      - AUTHZ_SERVICE_URL=${AUTHZ_SERVICE_URL:-http://authz-service:3000}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./packages/sfdc-server-vanilla/src/keys/private.key
        target: /app/examples/b2b/packages/sfdc-server-vanilla/dist/keys/private.key
      - type: bind
        source: ./packages/sfdc-server-vanilla/src/keys/certificate.crt
        target: /app/examples/b2b/packages/sfdc-server-vanilla/dist/keys/certificate.crt
    depends_on:
      dragonfly:
        condition: service_healthy

  authz-service:
    build:
      context: ../../
      dockerfile: packages/authz-service/Dockerfile
    container_name: pzero-b2b-authz-service
    networks:
      - pzero-network
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=${REDIS_URL:-redis://dragonfly:6379}
      - CHALLENGE_SECRET=${CHALLENGE_SECRET}
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy

  pzero-b2b-envoy:
    build:
      context: ../../
      dockerfile: packages/envoy-wasm-filter/Dockerfile
    container_name: pzero-b2b-envoy-proxy
    networks:
      - pzero-network
    ports:
      - "3001:8081" # External port for B2B WASM filter requests
      - "9903:9902" # Admin interface
    volumes:
      - ./envoy-b2b.yaml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      - ENVOY_LOG_LEVEL=info
    depends_on:
      pzero-sfdc-server:
        condition: service_started
      authz-service:
        condition: service_started

volumes:
  dragonfly_data:

# NOTE: pzero-network is external and must be created manually before bringing up the stack:
#   docker network create pzero-network
# See ../../packages/authz-service/README.md for instructions on generating strong secrets
# for CHALLENGE_SECRET and other sensitive environment variables.
networks:
  pzero-network:
    external: true
