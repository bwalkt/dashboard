name: pzero-b2b
version: "3.9"
services:
  pzero-sfdc-server:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set SFDC_SERVER_IMAGE to override the full image path
    image: ${SFDC_SERVER_IMAGE:-ghcr.io/${GITHUB_OWNER}/sfdc-server-vanilla:latest}
    container_name: pzero-sfdc-server
    ports:
      - "3000:3000" # Internal port for direct access (optional)
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_CONTAINER=true
      # Salesforce Configuration
      - SALESFORCE_CONSUMER_KEY=${SALESFORCE_CONSUMER_KEY}
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_LOGIN_URL=${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      # GitHub OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      # Database Configuration
      - DATABASE_PATH=${DATABASE_PATH:-./database.db}
      # OAuth Callback URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:1420}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./private.key
        target: /app/src/keys/private.key
        is_directory: false
        content: |
          private key content
      - type: bind
        source: ./certificate.crt
        target: /app/src/keys/certificate.crt
        is_directory: false
        content: |
          certificate content
