name: pzero-b2b-envoy
x-common: &common
  networks:
    - default
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"
x-clickhouse-defaults: &clickhouse-defaults
  !!merge <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9363"
    signoz.io/path: "/metrics"
  depends_on:
    pzero-init-clickhouse:
      condition: service_completed_successfully
    pzero-zookeeper-1:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - wget
      - --spider
      - -q
      - 0.0.0.0:8123/ping
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
x-zookeeper-defaults: &zookeeper-defaults
  !!merge <<: *common
  image: signoz/zookeeper:3.7.1
  user: root
  labels:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"
  healthcheck:
    test:
      - CMD-SHELL
      - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
    interval: 30s
    timeout: 5s
    retries: 3
x-db-depend: &db-depend
  !!merge <<: *common
  depends_on:
    pzero-clickhouse:
      condition: service_healthy
    pzero-schema-migrator-sync:
      condition: service_completed_successfully

services:
  pzero-init-clickhouse:
    !!merge <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    container_name: pzero-signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - ./common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
  pzero-zookeeper-1:
    !!merge <<: *zookeeper-defaults
    container_name: pzero-signoz-zookeeper-1
    # ports:
    #   - "2181:2181"
    #   - "2888:2888"
    #   - "3888:3888"
    volumes:
      - ./common/zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
  pzero-clickhouse:
    !!merge <<: *clickhouse-defaults
    container_name: pzero-signoz-clickhouse
    # ports:
    #   - "9000:9000"
    #   - "8123:8123"
    #   - "9181:9181"
    volumes:
      - ./common/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./common/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./common/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./common/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - ./common/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./clickhouse:/var/lib/clickhouse/
      # - ./common/clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml
  pzero-signoz:
    !!merge <<: *db-depend
    image: signoz/signoz:${VERSION:-v0.96.1}
    container_name: pzero-signoz
    command:
      - --config=/root/config/prometheus.yml
    ports:
      - "9090:8080" # signoz port
    #   - "6060:6060"     # pprof port
    volumes:
      - ./common/signoz/prometheus.yml:/root/config/prometheus.yml
      - ./common/dashboards:/root/config/dashboards
      - ./sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://pzero-clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - DASHBOARDS_PATH=/root/config/dashboards
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
      - DOT_METRICS_ENABLED=true
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
  pzero-otel-collector:
    !!merge <<: *db-depend
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-v0.129.6}
    container_name: pzero-signoz-otel-collector
    command:
      - --config=/etc/otel-collector-config.yaml
      - --manager-config=/etc/manager-config.yaml
      - --copy-path=/var/tmp/collector-config.yaml
      - --feature-gates=-pkg.translator.prometheus.NormalizeName
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./common/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      # - "1777:1777"     # pprof extension
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      pzero-signoz:
        condition: service_healthy
  pzero-schema-migrator-sync:
    !!merge <<: *common
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-v0.129.6}
    container_name: pzero-schema-migrator-sync
    command:
      - sync
      - --dsn=tcp://pzero-clickhouse:9000
      - --up=
    depends_on:
      pzero-clickhouse:
        condition: service_healthy
    restart: on-failure
  pzero-schema-migrator-async:
    !!merge <<: *db-depend
    image: signoz/signoz-schema-migrator:${OTELCOL_TAG:-v0.129.6}
    container_name: pzero-schema-migrator-async
    command:
      - async
      - --dsn=tcp://pzero-clickhouse:9000
      - --up=
    restart: on-failure
  pzero-envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: pzero-envoy-proxy
    ports:
      - "8080:8080" # External port for client requests
      - "9901:9901" # Admin interface
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    depends_on:
      - pzero-sfdc-server-vanilla
      - pzero-otel-collector
    networks:
      - default
    restart: unless-stopped
    environment:
      - ENVOY_LOG_LEVEL=info

  pzero-sfdc-server-vanilla:
    build:
      context: .
      dockerfile: ./packages/sfdc-server-vanilla/Dockerfile
    container_name: pzero-sfdc-server-vanilla
    ports:
      - "3000:8080" # Internal port for direct access (optional)
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DOCKER_CONTAINER=true
      # Salesforce Configuration
      - SALESFORCE_CONSUMER_KEY=${SALESFORCE_CONSUMER_KEY}
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_LOGIN_URL=${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      # GitHub OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      # Database Configuration
      - DATABASE_PATH=${DATABASE_PATH:-./database.db}
      # OAuth Callback URL
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:1420/auth/sign-in}
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    driver: bridge
volumes:
  clickhouse:
    name: pzero-signoz-clickhouse
  sqlite:
    name: pzero-signoz-sqlite
  zookeeper-1:
    name: pzero-signoz-zookeeper-1
