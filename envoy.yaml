tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      http_service:
        http_uri:
          uri: http://signoz-otel-collector:4318/v1/traces
          cluster: otel_collector
          timeout: 10s
        request_headers_to_add:
          - header:
              key: "Content-Type"
              value: "application/x-protobuf"
      service_name: envoy-proxy

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      http_service:
                        http_uri:
                          uri: http://signoz-otel-collector:4318/v1/traces
                          cluster: otel_collector
                          timeout: 10s
                        request_headers_to_add:
                          - header:
                              key: "Content-Type"
                              value: "application/x-protobuf"
                      service_name: envoy-proxy
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
                      common_config:
                        log_name: envoy_access_logs
                        transport_api_version: V3
                        grpc_service:
                          envoy_grpc:
                            cluster_name: otel_collector_logs
                      body:
                        string_value: |
                          {
                            "timestamp": "%START_TIME%",
                            "method": "%REQ(:METHOD)%",
                            "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
                            "response_code": "%RESPONSE_CODE%",
                            "response_flags": "%RESPONSE_FLAGS%",
                            "bytes_received": "%BYTES_RECEIVED%",
                            "bytes_sent": "%BYTES_SENT%",
                            "duration": "%DURATION%",
                            "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%",
                            "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%",
                            "user_agent": "%REQ(USER-AGENT)%",
                            "request_id": "%REQ(X-REQUEST-ID)%",
                            "authorization": "%REQ(authorization)%",
                            "jwt_payload": "%REQ(x-jwt-payload)%"
                          }
                      attributes:
                        values:
                          - key: "service.name"
                            value:
                              string_value: "envoy-proxy"
                          - key: "service.version"
                            value:
                              string_value: "1.30"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: server_cluster }
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        jwt_auth:
                          local_jwks:
                            inline_string: |
                              {
                                "keys": [
                                  {
                                    "kty": "oct",
                                    "kid": "jwt-secret",
                                    "k": "eW91cl9zdXBlcl9zZWNyZXRfand0X2tleV9jaGFuZ2VfdGhpc19pbl9wcm9kdWN0aW9u"
                                  }
                                ]
                              }
                          forward: true
                          forward_payload_header: "x-jwt-payload"
                          from_headers:
                            - name: "Authorization"
                              value_prefix: "Bearer "
                          from_cookies:
                            - "accessToken"
                            - "refreshToken"
                      rules:
                        # Allow auth routes without JWT authentication
                        - match: { prefix: "/auth/login" }
                          requires: {}
                        - match: { prefix: "/auth/callback" }
                          requires: {}
                        # Allow OPTIONS requests for CORS preflight
                        - match:
                            prefix: "/"
                            headers:
                              - name: ":method"
                                exact_match: "OPTIONS"
                          requires: {}
                        # Require JWT for all other routes
                        - match: { prefix: "/" }
                          requires:
                            provider_name: "jwt_auth"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: server_cluster
      connect_timeout: 10s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: server_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: sfdc-server-vanilla, port_value: 8080 }
    - name: otel_collector
      connect_timeout: 10s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: signoz-otel-collector, port_value: 4318 }
    - name: otel_collector_logs
      connect_timeout: 10s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector_logs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: signoz-otel-collector, port_value: 4317 }
    - name: otel_collector_metrics
      connect_timeout: 10s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector_metrics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: signoz-otel-collector, port_value: 4317 }

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel_collector_metrics
      prefix: "envoy"
