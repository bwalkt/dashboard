static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %RESPONSE_CODE% user=%REQ(authorization)% cookies=%REQ(cookie)% jwt_payload=%REQ(x-jwt-payload)%\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: server_cluster }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        jwt_auth:
                          local_jwks:
                            inline_string: |
                              {
                                "keys": [
                                  {
                                    "kty": "oct",
                                    "kid": "jwt-secret",
                                    "k": "eW91cl9zdXBlcl9zZWNyZXRfand0X2tleV9jaGFuZ2VfdGhpc19pbl9wcm9kdWN0aW9u"
                                  }
                                ]
                              }
                          forward: true
                          forward_payload_header: "x-jwt-payload"
                          from_headers:
                            - name: "Authorization"
                              value_prefix: "Bearer "
                          from_cookies:
                            - "accessToken"
                            - "refreshToken"
                      rules:
                        - match: { prefix: "/" }
                          requires:
                            provider_name: "jwt_auth"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: server_cluster
      connect_timeout: 10s
      type: logical_dns
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: server_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 3000 }

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
