# Redis configuration for Fastify application

# Network
bind 0.0.0.0
port 6379
timeout 300

# Security
# requirepass your_secure_password_here  # Uncomment and set in production

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
tcp-backlog 511

# Clients
maxclients 10000

# Append only file
appendonly yes
appendfsync everysec

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Enable keyspace notifications for cache invalidation
notify-keyspace-events Ex