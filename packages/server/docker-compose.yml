name: pzero-api-server

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: pzero-postgres
    restart: unless-stopped
    networks:
      - pzero-network
    command: ["postgres", "-c", "shared_preload_libraries=pgx_ulid"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pzero}
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # Changed default from 5432 to 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: pzero-dragonfly
    restart: unless-stopped
    networks:
      - pzero-network
    volumes:
      - dragonfly_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  authz-service:
    build:
      context: ../../
      dockerfile: packages/authz-service/Dockerfile
    container_name: pzero-authz-service
    restart: unless-stopped
    networks:
      - pzero-network
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://dragonfly:6379
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-default-secret-change-in-production}
      - CHALLENGE_TTL=${CHALLENGE_TTL:-300}
    depends_on:
      dragonfly:
        condition: service_healthy

  pzero-server:
    build:
      context: ../../
      dockerfile: packages/server/Dockerfile
    container_name: pzero-server
    restart: unless-stopped
    networks:
      - pzero-network
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8090}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pzero}
      - POSTGRES_MAX_CLIENTS=${POSTGRES_MAX_CLIENTS:-20}
      - POSTGRES_IDLE_TIMEOUT=${POSTGRES_IDLE_TIMEOUT:-30000}
      - POSTGRES_CONNECTION_TIMEOUT=${POSTGRES_CONNECTION_TIMEOUT:-2000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pzero}
      - REDIS_HOST=dragonfly
      - REDIS_PORT=6379
      - REDIS_URL=redis://dragonfly:6379
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-P-Zero}
      - EMAIL_EXPIRY_MINUTES=${EMAIL_EXPIRY_MINUTES:-100}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:1420,http://localhost:1430}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-false}
      - CORS_EXPOSED_HEADERS=${CORS_EXPOSED_HEADERS:-Content-Range,X-Content-Range,X-Test-Eval}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization,X-Requested-With,Accept,traceparent,x-client-type,x-auth-token,tracestate,X-Custom-Auth,x-grpc-web,x-grpc-web-accept-encoding,X-Custom-Header,X-Test-Eval}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY=${TWILIO_API_KEY}
      - TWILIO_API_SECRET=${TWILIO_API_SECRET}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_MESSAGE=${TWILIO_MESSAGE}
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
      - SIGNOZ_API_URL=${SIGNOZ_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    volumes:
      - ./src:/app/packages/server/src

  pzero-envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: pzero-envoy-proxy
    networks:
      - pzero-network
    ports:
      - "8181:8080" # External port for client requests
      - "9901:9901" # Admin interface
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      - ENVOY_LOG_LEVEL=info
    depends_on:
      pzero-server:
        condition: service_started
      authz-service:
        condition: service_started

  pzero-envoy-wasm:
    build:
      context: ../../
      dockerfile: packages/envoy-wasm-filter/Dockerfile
    container_name: pzero-envoy-wasm-proxy
    networks:
      - pzero-network
    ports:
      - "8182:8081" # External port for WASM filter requests
      - "6380:6380" # Redis proxy port  
      - "9902:9902" # Admin interface
    volumes:
      - ./envoy-wasm.yaml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      - ENVOY_LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-default-secret-key-change-in-production}
    depends_on:
      pzero-server:
        condition: service_started
      authz-service:
        condition: service_started
      dragonfly:
        condition: service_healthy

volumes:
  postgres_data:
  dragonfly_data:
  redis_data:

networks:
  pzero-network:
    external: true
