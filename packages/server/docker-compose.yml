name: pzero-api-server

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: pzero-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pgx_ulid"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pzero}
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # Changed default from 5432 to 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: pzero-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pzero-server:
    build:
      context: ../../
      dockerfile: packages/server/Dockerfile
    container_name: pzero-server
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8090}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pzero}
      - POSTGRES_MAX_CLIENTS=${POSTGRES_MAX_CLIENTS:-20}
      - POSTGRES_IDLE_TIMEOUT=${POSTGRES_IDLE_TIMEOUT:-30000}
      - POSTGRES_CONNECTION_TIMEOUT=${POSTGRES_CONNECTION_TIMEOUT:-2000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-P-Zero}
      - EMAIL_EXPIRY_MINUTES=${EMAIL_EXPIRY_MINUTES:-100}
      - SIGNALWIRE_PROJECT_ID=${SIGNALWIRE_PROJECT_ID}
      - SIGNALWIRE_TOKEN=${SIGNALWIRE_TOKEN}
      - SIGNALWIRE_PHONE_NUMBER=${SIGNALWIRE_PHONE_NUMBER}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:1420}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-false}
      - CORS_EXPOSED_HEADERS=${CORS_EXPOSED_HEADERS:-Content-Range,X-Content-Range,X-test-eval}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization,X-Requested-With,Accept,traceparent,x-client-type,x-auth-token,tracestate,X-Custom-Auth,x-grpc-web,x-grpc-web-accept-encoding,X-Custom-Header}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/packages/server/src

  pzero-envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: pzero-envoy-proxy
    ports:
      - "8181:8080" # External port for client requests
      - "9901:9901" # Admin interface
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      - ENVOY_LOG_LEVEL=info
    depends_on:
      pzero-server:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
