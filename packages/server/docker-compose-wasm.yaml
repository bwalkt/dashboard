version: '3.8'

services:
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: pzero-envoy-wasm
    ports:
      - "8181:8080"
      - "9901:9901"
    volumes:
      - ./envoy-wasm.yaml:/etc/envoy/envoy.yaml
      - ./wasm-filter/build/header-validator.wasm:/etc/envoy/header-validator.wasm
    command: ["-c", "/etc/envoy/envoy.yaml", "-l", "debug"]
    networks:
      - pzero-network
    depends_on:
      - server

  server:
    container_name: pzero-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
    networks:
      - pzero-network

networks:
  pzero-network:
    driver: bridge