name: pzero-api-server

services:
  postgres:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set POSTGRES_IMAGE to override the full image path
    image: ${POSTGRES_IMAGE:-ghcr.io/${GITHUB_OWNER:-bwalkt}/server-postgres:latest}
    container_name: pzero-postgres
    restart: "no"
    command: ["postgres", "-c", "shared_preload_libraries=pgx_ulid"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pzero}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 60s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5433}:5432" # Changed default from 5432 to 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    networks:
      - dokploy-network # Dokploy network required in production

  pzero-server:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set SERVER_IMAGE to override the full image path
    image: ${SERVER_IMAGE:-ghcr.io/${GITHUB_OWNER}/server:latest}
    container_name: pzero-server
    restart: "no"
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8090}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-pzero}
      - POSTGRES_MAX_CLIENTS=${POSTGRES_MAX_CLIENTS:-20}
      - POSTGRES_IDLE_TIMEOUT=${POSTGRES_IDLE_TIMEOUT:-30000}
      - POSTGRES_CONNECTION_TIMEOUT=${POSTGRES_CONNECTION_TIMEOUT:-2000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/pzero}
      # Redis connection URL (supports password via redis://:password@host:port or redis://username:password@host:port)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-P-Zero}
      - EMAIL_EXPIRY_MINUTES=${EMAIL_EXPIRY_MINUTES:-100}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://sfdc-example.incmix.com}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - CORS_EXPOSED_HEADERS=${CORS_EXPOSED_HEADERS:-Content-Range,X-Content-Range,X-Test-Eval}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization,X-Requested-With,Accept,traceparent,x-client-type,x-auth-token,tracestate,X-Custom-Auth,x-grpc-web,x-grpc-web-accept-encoding,X-Custom-Header,X-Test-Eval}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_API_KEY=${TWILIO_API_KEY}
      - TWILIO_API_SECRET=${TWILIO_API_SECRET}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_MESSAGE=${TWILIO_MESSAGE}
      - SIGNOZ_API_URL=${SIGNOZ_API_URL}
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy


  pzero-envoy-wasm:
    image: ${RUST_WASM_FILTER_IMAGE:-ghcr.io/${GITHUB_OWNER:-bwalkt}/rust-wasm-filter:latest}
    container_name: pzero-envoy-wasm-proxy
    ports:
      - "8182:8081" # External port for client requests
      - "9902:9902" # Admin interface
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    restart: "no"
    environment:
      - ENVOY_LOG_LEVEL=info
    depends_on:
      pzero-server:
        condition: service_started
    volumes:
      - ./envoy-wasm.yaml:/etc/envoy/envoy.yaml

volumes:
  postgres_data:
