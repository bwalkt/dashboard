name: openziti
services:
  golang-proxy:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: golang-proxy
    networks:
      - pzero
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
    restart: unless-stopped

networks:
  pzero:
    external: true
