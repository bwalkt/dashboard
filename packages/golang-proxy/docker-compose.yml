name: openziti
version: "3.9"
services:
  golang-proxy:
    # Image from GitHub Container Registry
    # Set GITHUB_OWNER to the repository owner (org or username), not your personal username
    # Or set GOLANG_PROXY_IMAGE to override the full image path
    image: ${GOLANG_PROXY_IMAGE:-ghcr.io/${GITHUB_OWNER}/golang-proxy:latest}
    container_name: golang-proxy
    # ports:
    #   - "8282:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./simple-server.json
        target: /app/simple-server.json
        is_directory: false
        content: |
          {"test": "test"}
