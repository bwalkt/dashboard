[package]
name = "rust-wasm-filter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"  # Pinned to 0.21 - v0.22 has breaking changes that would require code updates

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
